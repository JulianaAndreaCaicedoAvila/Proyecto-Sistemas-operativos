<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Perfil de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Artemisa</h1>
        </div>
        <nav>
            <a href="Principal.html">Inicio</a>
            <a href="portalMovimientos.HTML">Registro Movimientos</a>
            
        </nav>
    </header>

    <div class="profile-container"  style="    background-color: #e7b8d5; /* Color al pasar el mouse */
">
        <h2>Gestión de Perfil</h2>
        <form action="actualizar-perfil.php" method="POST" id="perfil-form">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su correo" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su teléfono">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Nueva contraseña">

            <label for="confirmar-password">Confirmar Contraseña:</label>
            <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Confirme su contraseña">

            <input class="add-to-cart-btn"  type="submit" value="Actualizar Datos">
        </form>
        <button  style=" position: relative;left: 79%;    border-radius: 4px;" class="add-to-cart-btn" onclick="window.location.href='Principal.html'"> Cancelar</button>

    </div>
    <script src="script.js"></script>
</body>
</html>
